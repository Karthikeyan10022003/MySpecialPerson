<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Special Thing – 3D</title>
<style>
:root{color-scheme:dark;--ac:#ffb3c7;--card:#140f1fdd;--fg:#f4efe6;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0f0d17;color:var(--fg);font-family:Georgia,serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ti{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px;font-size:13px;color:#fff;text-shadow:0 1px 4px #000}
#pg{position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:14px;right:14px;height:3px;background:#fff3}#pb{height:100%;width:0;background:var(--ac);transition:width .5s}
#bt{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px))}
#cp{background:var(--card);border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.5;max-width:520px;margin:0 auto 8px}
#ct{display:flex;justify-content:center;gap:14px}
button{background:#2a2536;color:var(--fg);border:0;border-radius:50%;width:46px;height:46px;font-size:18px}
#ov{position:fixed;inset:0;background:#0f0d17ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#ov button{width:auto;border-radius:30px;padding:0 28px;background:var(--ac);color:#111;font-size:18px}

<canvas id="c"></canvas><div id="ti"></div><div id="pg"><div id="pb"></div></div>
<div id="bt"><div id="cp"></div><div id="ct"><button id="pv">⏮</button><button id="pp">⏸</button><button id="nx">⏭</button><button id="mu">🔊</button></div></div>
<div id="ov"><h2>A Special Thing · 3D</h2><div style="color:#b9b2c4">19 scenes · every line has its own shot<br>Drag to look around · screen-record to save</div><button id="go">▶ Enter</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id);
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T.Scene(),cam=new T.PerspectiveCamera(55,1,.1,80);
sc.add(new T.HemisphereLight(0xffffff,0x444466,.95));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(4,8,5);sc.add(dl);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const M=c=>new T.MeshLambertMaterial({color:c}),mesh=(g,c,x,y,z)=>{const m=new T.Mesh(g,M(c));m.position.set(x||0,y||0,z||0);return m};
const CC={b:[0xc98f63,0x1b1411,0x1d1f2a],h:[0xd9a07a,0x150f0f,0xf1e3b0],g:[0xd49a74,0x2a1a14,0x8c6bb1],o:[0xb87c55,0x3a2a1a,0x6a8fb5]};
function person(k){const kid=k[0]=='k',t=kid?k[1]:k[0],[s,hr,ot]=CC[t],f=t=='h'||t=='g',g=new T.Group(),b=new T.Group();g.add(b);
const sph=(r,c,x,y,z,sx,sy,sz)=>{const m=mesh(new T.SphereGeometry(r,16,12),c,x,y,z);m.scale.set(sx||1,sy||1,sz||1);b.add(m)};
[-.15,.15].forEach(x=>b.add(mesh(new T.CylinderGeometry(.12,.12,.8),0x2b2b3a,x,.4,0)));
b.add(mesh(new T.CylinderGeometry(.3,f?.4:.34,f?1.3:.9,16),ot,0,f?1:1.2,0));
if(f){for(let i=0;i<5;i++)sph(.05,0x5f8f5a,Math.sin(i*1.9)*.2,.6+i*.17,.35);sph(.04,0xd4a937,0,1.5,.34)}else if(t=='b')b.add(mesh(new T.BoxGeometry(.3,.28,.02),0x9aa3b3,0,1.25,.32));
sph(.3,s,0,1.95,0);b.add(mesh(new T.SphereGeometry(.325,16,12,0,Math.PI*2,0,Math.PI*.55),hr,0,1.97,-.02));
if(f){sph(.33,hr,0,1.6,-.14,1,1.7,.7);sph(.08,0xff7fc0,-.22,2.12,.18);sph(.035,0xffd36e,-.22,2.12,.25);sph(.025,0xdd3333,0,2.05,.3)}
if(t=='b')sph(.28,hr,0,1.8,.07,1,.55,.8);
sph(.035,0x111111,-.1,1.99,.3);sph(.035,0x111111,.1,1.99,.3);
const sm=mesh(new T.TorusGeometry(.08,.014,6,12,Math.PI),0xffffff,0,1.86,.3);sm.rotation.z=Math.PI;b.add(sm);
const arm=sg=>{const p=new T.Group();p.position.set(sg*.4,1.6,0);p.add(mesh(new T.CylinderGeometry(.07,.07,.8),s,0,-.4,0),mesh(new T.CylinderGeometry(.095,.095,.35),ot,0,-.15,0));if(sg>0)p.add(mesh(new T.CylinderGeometry(.085,.085,.05),0xcfd3d8,0,-.72,0));b.add(p);return p};
g.userData={b,aL:arm(-1),aR:arm(1)};if(kid)g.scale.setScalar(.68);return g}
function env(ks,h){const g=new T.Group();rain=null;ks.forEach(k=>{
if(k=='tree')for(let i=0;i<6;i++){const a=i*1.1,x=Math.cos(a)*7,z=-2-Math.abs(Math.sin(a))*6;g.add(mesh(new T.CylinderGeometry(.15,.2,1.6),0x6b4a2f,x,.8,z),mesh(new T.ConeGeometry(.9,2.4,8),0x3f8f5a,x,2.6,z))}
if(k=='bld')for(let i=0;i<7;i++){const hh=3+(i*5)%5;g.add(mesh(new T.BoxGeometry(2+i%2,hh,2),new T.Color(`hsl(${h+i*12},25%,${35+i%3*8}%)`),-9+i*3,hh/2,-9-(i%2)*2))}
if(k=='board')g.add(mesh(new T.BoxGeometry(6,2.6,.15),0x1f4d3a,0,2.1,-5));
if(k=='desk')for(let i=-1;i<2;i++)g.add(mesh(new T.BoxGeometry(1.3,.8,.7),0x8a5a33,i*2.2,.4,-2.5));
if(k=='road'){g.add(mesh(new T.BoxGeometry(5,.02,40),0x333844,0,.01,-8));for(let i=0;i<8;i++)g.add(mesh(new T.BoxGeometry(.15,.03,1),0xf2d04a,0,.03,-i*3+2))}
if(k=='bike'){[-.45,.45].forEach(z=>{const w=new T.Mesh(new T.TorusGeometry(.38,.05,8,20),M(0x111111));w.position.set(3,.4,z);w.rotation.y=Math.PI/2;g.add(w)});g.add(mesh(new T.BoxGeometry(.1,.1,1),0xdd3333,3,.7,0))}
if(k=='ball'){g.add(mesh(new T.SphereGeometry(.15),0xcc2222,-1,.15,2.2));for(let i=-1;i<2;i++)g.add(mesh(new T.CylinderGeometry(.03,.03,.8),0xe9d9a8,-4+i*.15,.4,-2))}
if(k=='cake')g.add(mesh(new T.CylinderGeometry(.9,.9,.8),0x8a5a33,0,.4,1.6),mesh(new T.CylinderGeometry(.5,.5,.4),0xffb3c7,0,1,1.6),mesh(new T.SphereGeometry(.07),0xffd36e,0,1.35,1.6));
if(k=='mud')g.add(mesh(new T.CylinderGeometry(1.2,1.2,.04),0x5b3a24,0,.02,1.3));
if(k=='laptop')g.add(mesh(new T.BoxGeometry(.9,.8,.6),0x8a5a33,2.4,.4,1.4),mesh(new T.BoxGeometry(.7,.05,.45),0x999999,2.4,.83,1.4),mesh(new T.BoxGeometry(.7,.45,.04),0x66ccff,2.4,1.08,1.2));
if(k=='moon'||k=='sun'){const m=new T.Mesh(new T.SphereGeometry(1.4),new T.MeshBasicMaterial({color:k=='sun'?0xffc36b:0xe8eaff}));m.position.set(k=='sun'?4:-4,6,-14);g.add(m)}
if(k=='rain'){const a=new Float32Array(900);for(let i=0;i<900;i+=3){a[i]=Math.random()*20-10;a[i+1]=Math.random()*10;a[i+2]=Math.random()*14-8}const gm=new T.BufferGeometry();gm.setAttribute('position',new T.BufferAttribute(a,3));rain=new T.Points(gm,new T.PointsMaterial({color:0xaaccff,size:.08}));g.add(rain)}});return g}
const S=[
[270,['b','h'],['moon'],'A Special Thing',[['When I say “special thing”, you may think of something expensive, or a precious gift from someone special.','🎁',0],['Not that. Let me rephrase: not a thing, a person. Not a lover, not a best friend either.','🧍',3],['It’s a person I found in the middle of my survival.','🌊',5]]],
[240,['b'],['road'],'Before her: the past',[['Starting directly would hide her importance, so first the past.','⏪',0],['I was a core introvert before the words existed, and socially awkward, stuck whenever someone asked me to speak.','😶',1],['If someone says “hey then?”, I just say “hey then?” back.','💬',3],['My fear wasn’t heights or dogs; it was being alone, stuck in the middle of the road.','🛣️',4]]],
[50,['kb','ko','ko'],['desk','board'],'The pen-grip phase',[['When school moved from pencil to pen, no more mistakes were allowed (whitener and Pelikan aside).','🖊️',0],['I didn’t even know how to hold it, so I copied classmates: one boy’s grip in the morning, another’s after noon.','🤔',1],['I never settled on one grip till school ended. The point: I got stuck at everything and copied others to survive.','😵',5]]],
[200,['b','o','o'],['tree','ball'],'Copying to belong',[['I chose hobbies by watching others, having no interest of my own.','👀',1],['I’d adopt a group’s interests, follow one person as a role model, and make his interests mine.','🪞',0],['I called them friends. Only boys.','👦',4]]],
[100,['kb','kh'],['tree'],'The first girl friend',[['Then came a girl friend. Around her I didn’t copy anyone, except the pen grip.','🌱',0],['She introduced me to her friends; shy as ever, I still mingled, playing hide and seek.','🙈',5],['Suddenly I suggested 7 Stones, my first game suggestion ever.','🪨',1],['I was trying new things, and it felt like a meaningful friendship.','💛',3]]],
[25,['kh','ko'],['mud','tree'],'The mud incident',[['Chaos: she slid badly in mud during hide and seek and I laughed. That was fine, she was in her safe circle.','😂',0],['But I told a friend I copied, expecting secrecy. She was the school topper with a great image; he trolled it to everyone.','📢',2],['Her image broke and our true friendship dropped. I was stuck mid-road again.','💔',3],['I cut ties with him, and for years after, no girl friends.','✂️',4]]],
[160,['b','g'],['board','desk'],'The maths girl',[['I learned my wishes and hobbies only came with a girl friend. Near the end of middle school I realised it wasn’t gender, only her.','💡',0],['A new girl friend came. I love maths (not a topper, I freeze in exams) and I taught her happily.','➗',1],['I hoped my thoughts would refresh, but she talked to me only for maths marks.','📈',2],['My muddy brain and deluded heart did everything, even her summer project: 2 weeks of work, 2 weeks of holiday.','📚',5]]],
[330,['b','ko','ko'],['ball','tree'],'Used and thrown',[['I roamed with junior boys; boys my age mostly avoided me, talkless and boring, and I was also ragged.','🏏',0],['Dad teased me; I stayed blank.','😐',1],['After board exams she got committed to my best friend, and her purpose done, she left abruptly.','💔',3],['I was dizzy, nearly fainted, and in that depression accidentally dropped a ₹10 coin into my mouth.','🪙',1],['Lesson: it’s not about gender. Some people bring you out, some use you and throw you.','⚖️',4]]],
[215,['b'],['bld','laptop'],'Boys’ school to lockdown',[['Was she the special one? Not really. I’d also lost a good friend in the pen phase.','❓',0],['She’d get angry at me not to hurt me, but because I was someone anyone in the group could troll, with no proper body language.','😬',1],['I finished schooling in a boys’ school and joined engineering expecting movie-style college life, but you must be 10% like those heroes.','🎬',4],['Then lockdown came: a kingdom ruled by introverts like me.','😷',5]]],
[280,['b','g'],['laptop','moon'],'A missed gem',[['Still the copy phobia, now in texts, tempted to copy a guy who talks easily to girls.','📱',1],['As college group admin I got DMs from newcomers, and met an unexpected character who changed my life: a missed gem.','💬',0],['She introduced herself, and felt like therapy after the use-and-throw girl.','🩹',2],['I love music, always on a headset; she was a singer. She asked about my college work and even sent me to upload it.','🎤',5],['If you lose one thing, the universe sends something better.','🌌',3]]],
[300,['b','g'],['ball','bike','moon'],'Her little cares',[['She asked beyond “have you eaten, slept”, about me and my family. “Go safely” at the cricket ground.','🍚',2],['She was the first girl on my video calls; I’d ride a bicycle one-handed and she’d yell and cut the call.','🚲',0],['I watched cricket like a ghost, yet for her I stood chatting at long-on.','🏏',1],['She stayed up nights with me on my engineering graphics assignments.','📐',5],['Small things, but wholesome. I even wanted to learn piano to accompany her music.','🎹',3]]],
[350,['b','g*'],['moon'],'The bond I ruined',[['When real college resumed, I ruined the bond: fear of being trolled for choosing her over my friends, and her younger sister’s possessiveness.','😨',0],['I regret it and couldn’t bring it back; it might have become love.','🥀',1],['“Some things once gone can’t be regained by explanation.”','💔',4],['I fear my special person being lost like that.','🕰️',5]]],
[260,['b','h'],['moon'],'Wishing for a sister',[['Readers, that was the past, so you understand her. I have a younger brother (my Doraemon, another chapter).','💙',0],['Mom was a working woman, and I sometimes longed for an elder sister to give the care I missed.','👩‍💼',1],['The universe heard my subconscious and sent a non-elder sister: not older, not a girlfriend, not a best friend.','🌠',3],['She babysat me, complained gently, and went silent rather than scold me.','🤫',2]]],
[215,['b','h'],['bld','bike','rain'],'The cloudy evening',[['I joined my first company as a software dev, again with movie expectations.','💻',4],['Few bonds, except a best friend who introduced me to everyone (a gem too).','🤝',0],['She approached me and I answered like “yes ma’am”.','🙋',1],['Then one cloudy evening she stood waiting to go to her PG, unable to get Rapido rides. “Can I drop you?”','🌧️',2],['On my dad’s bike, I became her premium Rapido.','🏍️',5]]],
[20,['b','h'],['bld','road'],'Partner in crime',[['We explored small food places after office, my partner in crime.','🍜',0],['My mind still overthought: is she talking to me only for pick-up and drop?','🤔',1],['She wasn’t like that; I’d seriously cry when we clashed over my messiness.','😭',2],['With no female contact and no elder cousin sisters, I’d do anything. I wanted to impress my manager and her as a good brother: she’d be happy, and the manager… money matters.','💼',3]]],
[330,['b','h'],['bld','tree'],'Her in every chapter',[['In her I see every chapter. Like the pen phase: my own things, trying non-veg with her.','🍗',0],['Like the college gem: I wanted to show my hometown, and did it in a superior version.','🏡',4],['I felt love-like with the gem, not her, yet a sister bond is far superior: love breaks, friendships end, couples separate, marriages divorce, siblings never end.','♾️',3],['Only mom fed me by hand; she was the second.','🥄',2],['She picks my shirts, pants, raincoats, perfumes, phone case.','👕',1],['Around her I keep notes, post on Insta, put up songs (not dedicated to anyone).','📸',5],['A bond needs the same feelings on both sides.','🤝',0]]],
[10,['h','b','o'],['bld','bike'],'Brave sister',[['She was the boy, and I the little sister hiding behind her.','🛡️',0],['When a stranger dropped loose words at me and I held my anger, she raised her voice for me, something only my parents ever did.','🗣️',2],['I’m happy to be her trusted person with her life secrets.','🔐',1],['People think we’re a couple, but she’s a 10 out of 10: company for cricket and shopping alike.','🏏',4],['I disturb her for shopping, and even mom says to.','🛍️',3]]],
[345,['b','h'],['cake','tree'],'Worst day, happiest day',[['My worst day: I suddenly brought her home; mom scolded her so badly she cried all night.','😢',2],['In her place I’d have written 20 pages against my mum. She kept talking: “What did you do wrong? Only your parents.” So mature.','🌹',1],['I decided: she’s my sister; if I lose her, I’ve lost in life.','🔒',0],['Saved quote: even if I love someone, my sister comes first, then wife and lover.','📝',3],['My happiest day: her birthday, her tears of joy, my first time on the giving side.','🎂',4],['I almost ruined the surprise, but she was happy, and that’s enough.','🥹',1]]],
[320,['b','h'],['sun','tree'],'The special thing',[['I’ll be her brother for life, expecting nothing in return.','💞',0],['I want to change my personality so my sister doesn’t worry; we shouldn’t make three people worry: mum, dad and siblings.','🙏',5],['In the next narration, you’ll see a changed me.','🌅',4],['That bond was the “special thing”, god-gifted. I lied when I said I’m never on the receiving side:','🎁',3],['I received the most expensive gift from God.','❤️',1]]]];
const tc={};function tex(e){if(!tc[e]){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,72);tc[e]=new T.CanvasTexture(c)}return tc[e]}
const sp=[];for(let i=0;i<7;i++){const s=new T.Sprite(new T.SpriteMaterial({transparent:true,fog:false}));sc.add(s);sp.push(s)}
let si=0,li=0,pl=false,tm,ci=0,pop=0,yaw=0,t=0,ch=[],world,rain;const cur=new T.Vector3(0,2,6),look=new T.Vector3(0,1.3,0),tp=new T.Vector3(),tl=new T.Vector3();
function build(){if(world)sc.remove(world);world=new T.Group();sc.add(world);const[h,ks,es]=S[si],n=ks.length;sc.background=new T.Color(`hsl(${h},45%,24%)`);sc.fog=new T.Fog(sc.background,10,38);
world.add(mesh(new T.CircleGeometry(40,40).rotateX(-Math.PI/2),new T.Color(`hsl(${h},28%,30%)`)));world.add(env(es,h));
ch=ks.map((k,j)=>{const p=person(k),far=k.includes('*'),x=(j-(n-1)/2)*1.9;p.position.set(x,0,far?-4.5:0);p.rotation.y=-x*.3;world.add(p);return p})}
function line(){const Ls=S[si][4],L=Ls[li];$('ti').textContent=`${si+1}/19 · ${S[si][3]}`;$('cp').textContent=L[0];sp.forEach(s=>{s.material.map=tex(L[1]);s.material.needsUpdate=true});ci=L[2];pop=0;
$('pb').style.width=(si+(li+1)/Ls.length)/S.length*100+'%';clearTimeout(tm);if(pl)tm=setTimeout(()=>step(1),2800+L[0].length*50)}
function step(d){li+=d;if(li>=S[si][4].length){si=(si+1)%S.length;li=0;build()}else if(li<0){si=(si+S.length-1)%S.length;build();li=S[si][4].length-1}line()}
function aim(){const a=ch[0].position,z=ch[ch.length-1].position;return[[0,1.9,6.2,0,1.3,0],[a.x+.9,1.9,a.z+2.6,a.x,1.7,a.z],[z.x-.9,1.8,z.z+2.6,z.x,1.7,z.z],[0,.6,3.8,0,1.8,0],[0,5.5,5.5,0,.8,0],[-4.2,1.7,3.2,0,1.4,0]][ci]}
function loop(){requestAnimationFrame(loop);t+=.016;const a=aim();tp.set(a[0]+Math.sin(t*.3)*.5,a[1],a[2]);tl.set(a[3],a[4],a[5]);yaw*=.985;
const dx=tp.x-tl.x,dz=tp.z-tl.z,c=Math.cos(yaw),s=Math.sin(yaw);tp.x=tl.x+dx*c+dz*s;tp.z=tl.z-dx*s+dz*c;cur.lerp(tp,.04);look.lerp(tl,.05);cam.position.copy(cur);cam.lookAt(look);
ch.forEach((p,j)=>{const u=p.userData,sk=li%ch.length==j;u.b.position.y=Math.sin(t*2+j)*.03;u.aL.rotation.z=-.1-Math.sin(t*2+j)*.06;u.aR.rotation.z=sk?2.4+Math.sin(t*7)*.3:.1+Math.sin(t*2+j)*.06});
pop=Math.min(1,pop+.05);sp.forEach((s,i)=>{if(!i){s.position.set(0,3.3+Math.sin(t*2)*.1,0);s.scale.setScalar(1.7*pop)}else{const q=t*.5+i*1.05;s.position.set(Math.cos(q)*3.6,2.6+Math.sin(t+i)*.5,Math.sin(q)*2.4-1.5);s.scale.setScalar(.7*pop)}});
if(rain){const p=rain.geometry.attributes.position;for(let i=1;i<900;i+=3){p.array[i]-=.12;if(p.array[i]<0)p.array[i]=10}p.needsUpdate=true}R.render(sc,cam)}
let dr=0;const cv=$('c');cv.addEventListener('pointerdown',e=>dr=e.clientX);cv.addEventListener('pointermove',e=>{if(dr){yaw+=(e.clientX-dr)*.006;dr=e.clientX}});addEventListener('pointerup',()=>dr=0);
let ac,iv,on=true;const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function pad(){if(!on||iv)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();const gn=ac.createGain();gn.gain.value=.05;gn.connect(ac.destination);let k=0;
const ply=()=>CH[k++%4].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.frequency.value=f;o.connect(g);g.connect(gn);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.6,n+1.5);g.gain.linearRampToValueAtTime(0,n+4.2);o.start(n);o.stop(n+4.3)});ply();iv=setInterval(ply,4000)}
$('go').onclick=()=>{$('ov').remove();pl=true;pad();line()};
$('pp').onclick=()=>{pl=!pl;$('pp').textContent=pl?'⏸':'▶';pl?line():clearTimeout(tm)};
$('nx').onclick=()=>step(1);$('pv').onclick=()=>step(-1);
$('mu').onclick=()=>{on=!on;$('mu').textContent=on?'🔊':'🔇';if(on)pad();else{clearInterval(iv);iv=null}};
build();line();loop();
</script></body></html>
